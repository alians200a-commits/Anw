name: Apply Reviewed Editor Sync

on:
  push:
    branches:
      - sync-ai-security-2026-09-24
    paths:
      - tools/apply_drug_media_hardening.mjs
      - .github/workflows/apply-drug-media-hardening.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync-ai-security-2026-09-24
          fetch-depth: 0
      - name: Correct local sync guard and apply reviewed file
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/apply_drug_media_hardening.mjs')
          s = p.read_text()
          s = s.replace(' || !next.includes("display_name: inviteName.trim()")', '')
          p.write_text(s)
          PY
          node tools/apply_drug_media_hardening.mjs
      - name: Commit synchronized admin UI
        run: |
          git checkout -- tools/apply_drug_media_hardening.mjs
          if git diff --quiet -- src/admin/AdminAppV3.tsx; then
            echo "No admin UI changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/admin/AdminAppV3.tsx
          git commit -m "admin: enforce owner-admin team management UI"
          git push origin HEAD:sync-ai-security-2026-09-24
