name: Apply Reviewed Editor Sync

on:
  push:
    branches:
      - sync-ai-security-2026-09-24
    paths:
      - tools/apply_drug_media_hardening.mjs
      - .github/workflows/apply-drug-media-hardening.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync-ai-security-2026-09-24
          fetch-depth: 0
      - name: Apply reviewed local file
        run: node tools/apply_drug_media_hardening.mjs
      - name: Commit synchronized admin UI
        run: |
          if git diff --quiet -- src/admin/AdminAppV3.tsx; then
            echo "No admin UI changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/admin/AdminAppV3.tsx
          git commit -m "admin: enforce owner-admin team management UI"
          git push origin HEAD:sync-ai-security-2026-09-24
