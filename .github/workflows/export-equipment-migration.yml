name: Export Equipment Migration JSON

on:
  push:
    branches: [main]
    paths:
      - 'src/data/equipment.ts'
      - 'tools/export_equipment_migration_json.ts'
      - '.github/workflows/export-equipment-migration.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Export migration JSON
        run: npx tsx tools/export_equipment_migration_json.ts

      - name: Commit refreshed export
        shell: bash
        run: |
          if git diff --quiet -- migration/equipment-export.json && git ls-files --error-unmatch migration/equipment-export.json >/dev/null 2>&1; then
            echo 'Export is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add migration/equipment-export.json
          git commit -m 'chore: refresh equipment migration export'
          git push
