name: One-time Admin List Fix

on:
  push:
    paths:
      - '.github/workflows/one-time-admin-list-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Show all loaded admin content
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/admin/AdminApp.tsx')
          text = path.read_text(encoding='utf-8')
          old = 'content.slice(0, 50).map((item) => ('
          new = 'content.map((item) => ('
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one target, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'alians200a-commits'
          git config user.email 'alians200a@gmail.com'
          git add src/admin/AdminApp.tsx
          git commit -m 'fix: show all loaded admin content items'
          git push
