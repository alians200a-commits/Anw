name: One-time Drug Migration

on:
  push:
    paths:
      - '.github/workflows/one-time-drug-migration.yml'

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Run safe migration
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error 'https://obacdydiyskdszjydbus.supabase.co/functions/v1/migrate-legacy-drugs')"
          echo "$response"
          echo "$response" | grep -q '"ok":true'
