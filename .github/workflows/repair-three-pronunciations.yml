name: Repair Three Pronunciations

on:
  push:
    paths:
      - ".github/workflows/repair-three-pronunciations.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          pip install chatterbox-tts torchaudio pydub

      - name: Regenerate the three affected words
        run: |
          python - <<'PY'
          import hashlib
          import random
          import subprocess
          import tempfile
          from pathlib import Path

          import numpy as np
          import torch
          import torchaudio as ta
          from pydub import AudioSegment, silence
          from chatterbox.tts import ChatterboxTTS

          root = Path(".")
          reference = root / "public/audio/voice-samples/chatterbox-default.wav"
          model = ChatterboxTTS.from_pretrained(device="cpu")
          model.prepare_conditionals(str(reference), exaggeration=0.45)

          targets = [
              ("drugs", "propofol", "Propofol"),
              ("terms", "decrease", "Decrease"),
              ("terms", "dose", "Dose"),
          ]

          def seed_for(key: str) -> int:
              return int(hashlib.sha1(key.encode("utf-8")).hexdigest()[:8], 16) ^ 0x51A7C9

          def set_seed(seed: int):
              random.seed(seed)
              np.random.seed(seed % (2**32 - 1))
              torch.manual_seed(seed)

          def extract_middle_chunk(wav_path: Path, out_path: Path):
              audio = AudioSegment.from_wav(wav_path)

              # Split carrier sentence into spoken chunks separated by pauses.
              # Target word is intentionally the middle chunk.
              chunks = silence.split_on_silence(
                  audio,
                  min_silence_len=110,
                  silence_thresh=audio.dBFS - 24,
                  keep_silence=30,
              )

              if len(chunks) < 3:
                  chunks = silence.split_on_silence(
                      audio,
                      min_silence_len=80,
                      silence_thresh=audio.dBFS - 20,
                      keep_silence=25,
                  )

              if len(chunks) < 3:
                  raise RuntimeError(f"Could not isolate middle word; got {len(chunks)} chunks")

              # In rare cases the model creates tiny noise-only chunks.
              useful = [c for c in chunks if len(c) >= 120]
              if len(useful) < 3:
                  useful = chunks

              target = useful[1]

              # Trim residual edge silence, then leave a tiny clean pad.
              nonsilent = silence.detect_nonsilent(
                  target,
                  min_silence_len=45,
                  silence_thresh=target.dBFS - 28,
              )
              if nonsilent:
                  start = max(0, nonsilent[0][0] - 20)
                  end = min(len(target), nonsilent[-1][1] + 35)
                  target = target[start:end]

              padded = AudioSegment.silent(duration=45) + target + AudioSegment.silent(duration=70)
              padded.export(out_path, format="wav")

          with tempfile.TemporaryDirectory() as tempdir:
              temp = Path(tempdir)

              for group, item_id, word in targets:
                  set_seed(seed_for(f"{group}/{item_id}/carrier-v3"))

                  # Sacrificial first/last words absorb Chatterbox's occasional
                  # start/end-of-utterance vocal artifact.
                  carrier = f"Okay. {word}. Done."
                  wav = model.generate(
                      carrier,
                      exaggeration=0.45,
                      cfg_weight=0.45,
                  )

                  carrier_wav = temp / f"{item_id}-carrier.wav"
                  clean_wav = temp / f"{item_id}-clean.wav"
                  ta.save(str(carrier_wav), wav, model.sr)
                  extract_middle_chunk(carrier_wav, clean_wav)

                  out = root / "public/audio" / group / f"{item_id}.mp3"
                  subprocess.run([
                      "ffmpeg", "-y", "-loglevel", "error",
                      "-i", str(clean_wav),
                      "-filter:a", "atempo=0.85",
                      "-ac", "1",
                      "-ar", "24000",
                      "-codec:a", "libmp3lame",
                      "-b:a", "64k",
                      str(out),
                  ], check=True)

                  print(f"repaired {group}/{item_id}")

          PY

      - name: Commit repaired clips
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             public/audio/drugs/propofol.mp3             public/audio/terms/decrease.mp3             public/audio/terms/dose.mp3
          git commit -m "fix: remove onset artifacts from three pronunciations"
          git pull --rebase origin main
          git push
