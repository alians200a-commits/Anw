name: Slow Chatterbox Sample

on:
  push:
    paths:
      - ".github/workflows/slow-chatterbox-sample.yml"

permissions:
  contents: write

jobs:
  slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create slower versions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -y -i public/audio/voice-samples/chatterbox-default.wav -filter:a "atempo=0.90" public/audio/voice-samples/chatterbox-090.wav
          ffmpeg -y -i public/audio/voice-samples/chatterbox-default.wav -filter:a "atempo=0.85" public/audio/voice-samples/chatterbox-085.wav

      - name: Commit slower samples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio/voice-samples/chatterbox-090.wav public/audio/voice-samples/chatterbox-085.wav
          git commit -m "chore: add slower Chatterbox samples"
          git push
