name: Verify Web App

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "src/**"
      - "public/**"
      - "tools/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.*"
      - ".github/workflows/verify-web-app.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production readiness gate
        run: npm run verify

      - name: Dependency vulnerability gate
        run: npm audit --omit=dev --audit-level=high
