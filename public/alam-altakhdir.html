<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a2037"><title>عالم التخدير — معاينة مستقلة | دليلي</title>
<style>
:root{--navy:#0a2037;--gold:#d9a441;--blue:#2776b8;--text:#f8fbff;--muted:#c5d0dc;--line:#dbe4ee;--panel:#0c1520;--soft:#13243a;--radius:18px;font-family:'Noto Kufi Arabic','Noto Sans Arabic',Tahoma,Arial,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#05090e;color:var(--text);font-size:14px;line-height:1.95}button,input{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.shell{max-width:1092px;margin:22px auto 32px;padding:17px;border:1px solid rgba(227,236,247,.76);border-radius:23px;min-height:660px}.note{max-width:1092px;margin:17px auto 0;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:0 9px;color:#aebdcc;font-size:11px}.note strong{font-weight:700;color:#f2d18d}.note .dot{display:inline-block;background:#d9a441;border-radius:100%;width:6px;height:6px;margin-left:7px}
.hero{min-height:166px;background:var(--navy);border-radius:18px;padding:22px 24px;display:flex;flex-direction:column;justify-content:center}.brand{font-size:13px;color:var(--gold);font-weight:800}.hero h1{font-size:31px;line-height:1.55;margin:10px 0 5px;font-weight:850}.hero p{font-size:17px;margin:0;color:#f0f4fa}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:16px}.tile{text-align:right;position:relative;min-height:132px;border:1px solid var(--line);border-radius:17px;background:#070b10;color:var(--text);display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;padding:15px 18px 13px;transition:background .18s,border-color .18s,transform .18s}.tile:hover{background:#10233a;border-color:var(--gold);transform:translateY(-2px)}.tile:active{transform:scale(.99)}.tile .ico{position:absolute;top:15px;right:18px;color:var(--blue)}.tile h2{font-size:19px;line-height:1.5;margin:0 0 2px;font-weight:800}.tile p{font-size:13px;color:var(--muted);margin:0}.tile .arrow{position:absolute;left:17px;bottom:17px;color:var(--gold);opacity:0;transition:opacity .15s}.tile:hover .arrow{opacity:1}
.footnote{font-size:11px;color:#8fa0b2;margin:17px 3px 0}.detail{display:none}.detail.show{display:block}.home.hidden{display:none}.detail-hero{background:var(--navy);border-radius:18px;padding:19px 23px;margin-bottom:16px}.crumb{display:flex;align-items:center;gap:8px;color:var(--gold);font-size:12px;font-weight:700;margin-bottom:11px}.crumb button{border:0;background:transparent;color:#f3db9d;padding:2px 0;display:flex;gap:6px;align-items:center}.detail-hero h2{font-size:27px;line-height:1.5;margin:0 0 5px}.detail-hero p{color:#dce6ef;margin:0;font-size:13px}.detail-body{display:grid;grid-template-columns:minmax(0,1fr) 216px;gap:16px;align-items:start}.content{min-width:0}.sidebar{position:sticky;top:15px;border:1px solid #344960;border-radius:16px;padding:13px;background:#0a1522}.sidebar .side-title{font-size:11px;color:#aebdc9;margin:0 4px 10px}.sidebar button{border:0;background:none;color:#bfcbda;text-align:right;padding:10px;border-radius:10px;width:100%;display:flex;gap:8px;align-items:center;font-size:12px}.sidebar button:hover,.sidebar button.active{background:#18334e;color:#fff}.panel{background:#0d1723;border:1px solid #354556;border-radius:17px;padding:18px 20px;margin-bottom:12px}.panel h3{font-size:18px;margin:0 0 11px;color:#fff}.panel h4{font-size:15px;margin:15px 0 6px;color:#f1cf89}.panel p{color:#dbe5ef;margin:7px 0;font-size:13px}.panel ul,.panel ol{margin:7px 0 0;padding:0 25px 0 0;color:#dbe5ef;font-size:13px}.panel li{padding:3px 0}.panel .small{color:#aab8c7;font-size:11px}.panel .intro{font-size:14px;color:#eff5fb}.panel strong{color:#fff}.inner-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini{background:#12243a;border:1px solid #345071;border-radius:14px;padding:13px}.mini h4{margin:0 0 3px;font-size:14px;color:white}.mini p{margin:0;font-size:12px}.en{font:500 12px Arial,sans-serif;direction:ltr;display:inline-block;color:#b5c9e0}.tag{display:inline-flex;align-items:center;gap:5px;border-radius:99px;background:#1d3047;border:1px solid #48627c;padding:3px 11px;font-size:11px;color:#edcd8a}.faded{font-size:12px;color:#adbbca}.seg{display:flex;gap:7px;background:#0b1621;border:1px solid #425568;border-radius:13px;padding:5px;margin:0 0 13px;flex-wrap:wrap}.seg button{flex:1;min-width:130px;border:0;border-radius:9px;color:#b5c8dc;background:transparent;padding:10px 8px;font-size:12px}.seg button.active{color:#0a2037;background:#e8f0f8;font-weight:800}.hide{display:none!important}details{border:1px solid #3a5066;border-radius:13px;margin:9px 0;background:#0d1d2e;overflow:hidden}summary{list-style:none;cursor:pointer;padding:11px 14px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:12px}summary::-webkit-details-marker{display:none}summary .sub{font-size:11px;color:#b2bfd0;font-weight:400}summary::after{content:'＋';color:var(--gold);font-size:17px;font-weight:400}details[open] summary::after{content:'−'}details .in{padding:0 16px 14px;color:#dbe5ef}details .in ul{margin:0;padding-right:19px}.hint{border-right:3px solid #d9a441;padding:8px 12px;background:#1e2630;color:#e4edf5;font-size:12px;border-radius:0 8px 8px 0;margin-top:11px}.career-row{display:grid;grid-template-columns:1fr auto;gap:10px;border-bottom:1px solid #304358;padding:10px 2px}.career-row:last-child{border-bottom:0}.career-row b{font-size:12px}.career-row span{color:#d2bc86;font-size:12px}.q{border:1px solid #38516b;border-radius:13px;padding:12px;margin-bottom:10px;background:#11243a}.q b{color:#fff;font-size:13px}.q p{font-size:12px;margin:5px 0 0}.disclaimer{color:#d5d9df;font-size:11px;line-height:1.9;margin-top:12px;border:1px solid #796238;background:#2a261c;padding:12px;border-radius:10px}
@media(max-width:750px){.shell{margin:0;min-height:100vh;border:0;border-radius:0;padding:13px 12px 24px}.note{margin:0;background:#07111c;padding:6px 13px;font-size:10px}.hero{min-height:146px;padding:20px 17px}.brand{font-size:11px}.hero h1{font-size:26px;margin-top:5px}.hero p{font-size:13px;line-height:1.8}.grid{gap:9px;margin-top:12px}.tile{min-height:139px;padding:13px 10px 11px;border-radius:15px}.tile .ico{top:12px;right:12px}.tile h2{font-size:14px}.tile p{font-size:10.5px;line-height:1.7}.tile .arrow{left:10px;bottom:10px}.detail-hero{padding:16px}.detail-hero h2{font-size:22px}.detail-body{display:block}.sidebar{position:relative;display:flex;overflow:auto;gap:5px;margin-bottom:12px;white-space:nowrap;padding:6px;scrollbar-width:none}.sidebar::-webkit-scrollbar{display:none}.sidebar .side-title{display:none}.sidebar button{width:auto;flex-shrink:0;padding:9px 10px;font-size:11px}.panel{padding:14px 13px}.panel h3{font-size:16px}.inner-two{grid-template-columns:1fr}.seg button{min-width:0;font-size:11px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; connect-src 'self'">
</head>
<body>

<div class="shell">
  <div class="home" id="home">
    <header class="hero"><span class="brand">دليلي | مملكة التخدير</span><h1>عالم التخدير</h1><p>من أول يوم بالدراسة إلى العمل ضمن فريق التخدير</p></header>
    <div class="grid" id="cards"></div>
    <p class="footnote">اختر القسم للاطلاع على التفاصيل.</p>
  </div>
  <section class="detail" id="detail" aria-live="polite"><header class="detail-hero"><div class="crumb"><button id="back">↩ العودة إلى عالم التخدير</button></div><h2 id="detailTitle"></h2><p id="detailDesc"></p></header><div class="detail-body"><div class="content" id="content"></div><nav class="sidebar" id="sidebar" aria-label="أقسام عالم التخدير"><p class="side-title">التنقل بين الأقسام</p></nav></div></section>
</div>
<script defer src="/alam-altakhdir.js"></script>
</body>
</html>
